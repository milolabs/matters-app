# The checks every change must pass (ADR 0122). They are the same commands a person runs by hand;
# the README lists them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A release runs these same checks first (release.yml, ADR 0123).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint, boundaries, licenses, tests
    # macOS, because that is where Matters is developed and tested today.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # The lockfile is the list of versions we chose; an install that would change it fails.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Types
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Boundaries of the architecture
        run: bun run check:boundaries

      - name: Licenses of dependencies
        run: bun run check:licenses

      # Includes the node tier of the hostile-mail corpus (ADR 0047). A test gets two more tries:
      # a few tests time a child process being killed, and miss when every file runs at once.
      # The two tests that hold a search to a budget in milliseconds are left out: the budget is
      # set on a developer's machine, and a shared runner is slower and uneven (ADR 0122).
      - name: Tests
        run: bun run test --retry=2 --exclude '**/*Perf.test.ts'

      # The app as a release would build it, signed ad hoc: proves on every change that the
      # bundle, the fuses and the disk image can still be made (ADR 0123). Nothing is kept.
      - name: Package
        run: bun run release:macos
        env:
          MATTERS_SIGN_IDENTITY: "-"

  # The built app in a real window, driven by Playwright (ADR 0129): the first start with its setup
  # screen against the Dovecot test server, and the main screens. Linux, because its runners have
  # Docker; the macOS ones do not (ADR 0122).
  e2e:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # The Playwright runner runs under Node, not bun.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      # A screen for the window (xvfb), and a keyring for the password: the app refuses to save one
      # without a real Secret Service (GNOME Keyring here, reached over D-Bus through libsecret).
      - name: Screen and keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb dbus dbus-x11 gnome-keyring libsecret-1-0

      # One D-Bus session for the run, with the login keyring created and unlocked in it, so
      # safeStorage finds a real backend. The password is the keyring's own, on a throw-away runner.
      - name: End-to-end tests
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            echo -n "e2e" | gnome-keyring-daemon --unlock --components=secrets --daemonize > /dev/null
            xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" bun run test:e2e
          '

      # Kept whether the run passed or not: the HTML report, and each test's video, trace and
      # screenshots.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: .e2e/
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
