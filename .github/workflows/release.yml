# A release of Matters for macOS (ADR 0123, ADR 0124, docs/release.md).
#
# Started by hand, on main (Actions → Release → Run workflow). One run does all of it:
# the checks of CI; then the version is set, committed to main and tagged; then the build.
#
# - No version given: the next one is counted from apps/desktop/package.json
#   (0.1.0-alpha.1 → 0.1.0-alpha.2, 0.1.0 → 0.1.1). A version given is taken as it is.
# - A version with `-alpha.` makes an alpha, for a few invited testers before the project has a
#   Developer ID: signed ad hoc, not notarized, on a draft pre-release whose notes say so and say
#   how to open it. It uses no secret.
# - Any other version makes a real one: signed with the Developer ID, notarized by Apple, with a
#   list of what is inside it and a record of where it was built, on a draft release for a person
#   to read and publish.
# - With "rehearsal" ticked nothing is committed, tagged or published: the same build signed
#   ad hoc, kept with the run for five days.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, such as 0.1.0-beta.1. Empty: the next alpha, beta or patch."
        type: string
        required: false
      rehearsal:
        description: "Rehearsal: build and start the app, commit and publish nothing."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  rehearsal:
    name: Rehearsal (ad hoc, not published)
    if: inputs.rehearsal
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build and package
        run: bun run release:macos
        env:
          MATTERS_SIGN_IDENTITY: "-"

      - name: The packaged app starts
        run: |
          "dist/release/Matters.app/Contents/MacOS/Matters" &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::The packaged app did not stay up for 20 seconds."
            exit 1
          fi
          kill "$pid"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matters-rehearsal
          path: |
            dist/release/*.dmg
            dist/release/SHA256SUMS.txt
          retention-days: 5

  # After the checks, and only then: the version goes into the two files that carry it, as one
  # commit on main, and that commit gets the tag. The commit is made through GitHub's API with
  # the checked commit as its parent, so it is refused if main has moved since the run began.
  version:
    name: Set the version, commit, tag
    if: ${{ !inputs.rehearsal }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the version commit and the tag
    outputs:
      version: ${{ steps.set.outputs.version }}
      tag: ${{ steps.commit.outputs.tag }}
    steps:
      - name: A release is made from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on main, not on $GITHUB_REF_NAME."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Choose the version
        id: set
        env:
          NAMED: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(bun tools/next-version.ts --write "$NAMED")"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" > /dev/null 2>&1; then
            echo "::error::The tag v$version exists already."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit it to main and tag the commit
        id: commit
        env:
          VERSION: ${{ steps.set.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$GITHUB_SHA" \
            --arg headline "Matters $VERSION" \
            --arg package "$(base64 -w0 apps/desktop/package.json)" \
            --arg lock "$(base64 -w0 bun.lock)" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: "main" },
                expectedHeadOid: $head,
                message: { headline: $headline },
                fileChanges: { additions: [
                  { path: "apps/desktop/package.json", contents: $package },
                  { path: "bun.lock", contents: $lock }
                ] }
              } }
            }' > "$RUNNER_TEMP/commit.json"
          oid="$(gh api graphql --input "$RUNNER_TEMP/commit.json" --jq '.data.createCommitOnBranch.commit.oid')"
          if [ -z "$oid" ] || [ "$oid" = "null" ]; then
            echo "::error::The version commit was not made."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$oid" > /dev/null
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  alpha:
    name: Alpha (ad hoc, draft pre-release)
    if: contains(needs.version.outputs.version, '-alpha.')
    needs: version
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write # the draft release
      id-token: write # the record of where it was built
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: The tagged commit carries the version
        run: |
          version="$(plutil -extract version raw -o - apps/desktop/package.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG, but apps/desktop/package.json says $version."
            exit 1
          fi

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build and package
        run: bun run release:macos
        env:
          MATTERS_SIGN_IDENTITY: "-"

      - name: The packaged app starts
        run: |
          "dist/release/Matters.app/Contents/MacOS/Matters" &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::The packaged app did not stay up for 20 seconds."
            exit 1
          fi
          kill "$pid"

      - name: List what the app contains (SBOM)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist/release/Matters.app/Contents/Resources/app
          format: spdx-json
          output-file: dist/release/Matters-${{ env.VERSION }}-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        working-directory: dist/release
        run: shasum -a 256 Matters-*.dmg Matters-*.spdx.json > SHA256SUMS.txt

      # With no Developer ID, this record is the only proof of where the file comes from.
      - name: Record where it was built
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/Matters-*.dmg

      # The same record as a file beside the download, so it can be checked without asking GitHub:
      # gh attestation verify <dmg> --repo milolabs/matters-app --bundle <dmg>.intoto.jsonl
      - name: Keep the record beside the image
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/release/Matters-$VERSION-arm64.dmg.intoto.jsonl"

      - name: Draft the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          **An alpha, for invited testers.** This build is not signed with a Developer ID and not
          notarized by Apple, so macOS will refuse to open it until you allow it. Apple Silicon only.
          There are no updates: a newer alpha is a new download.

          Check the download first. This shows the workflow and the commit it was built from:

              gh attestation verify Matters-$VERSION-arm64.dmg --repo $GITHUB_REPOSITORY

          Then open the disk image, drag Matters to Applications, and start it once. macOS says it
          cannot check the app. Open System Settings → Privacy & Security, scroll down to
          "Matters was blocked", and choose Open Anyway.

          How to report what you find, and what to expect:
          [docs/release.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/release.md#alpha).
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --prerelease \
            --title "Matters $VERSION (alpha)" --notes-file "$RUNNER_TEMP/notes.md" \
            dist/release/Matters-*.dmg dist/release/Matters-*.dmg.intoto.jsonl \
            dist/release/Matters-*.spdx.json dist/release/SHA256SUMS.txt

  release:
    name: Sign, notarize, draft the release
    if: ${{ !contains(needs.version.outputs.version, '-alpha.') }}
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    # The secrets live in this environment, so a person can be required to approve each use of
    # them (Settings → Environments → release).
    environment: release
    permissions:
      contents: write # the draft release
      id-token: write # the record of where it was built
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: The tagged commit carries the version
        run: |
          version="$(plutil -extract version raw -o - apps/desktop/package.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG, but apps/desktop/package.json says $version."
            exit 1
          fi

      - name: Everything a release needs is here
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=0
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret $name is not set in the release environment."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install
        run: bun install --frozen-lockfile

      # A keychain of its own, with a password nobody keeps, removed at the end.
      - name: The Developer ID, in a keychain for this run
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/certificate.p12"
          (umask 077 && printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate")
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE holds no Developer ID Application certificate."
            exit 1
          fi
          echo "::add-mask::$identity"
          echo "MATTERS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: The key for notarization, in a file for this run
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          key="$RUNNER_TEMP/notary-key.p8"
          (umask 077 && printf '%s' "$APPLE_API_KEY" > "$key")
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Build, sign, notarize
        run: bun run release:macos
        env:
          MATTERS_REQUIRE_NOTARIZATION: "1"
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: The keychain and the key are removed
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/certificate.p12"

      - name: The packaged app starts
        run: |
          "dist/release/Matters.app/Contents/MacOS/Matters" &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::The packaged app did not stay up for 20 seconds."
            exit 1
          fi
          kill "$pid"

      # What is inside: every package the app ships with, by name, version and license.
      - name: List what the app contains (SBOM)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist/release/Matters.app/Contents/Resources/app
          format: spdx-json
          output-file: dist/release/Matters-${{ env.VERSION }}-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        working-directory: dist/release
        run: shasum -a 256 Matters-*.dmg Matters-*.spdx.json > SHA256SUMS.txt

      # A signed, public record that this file was built by this workflow from this commit.
      # Anyone can check it: gh attestation verify <file> --repo milolabs/matters-app
      - name: Record where it was built
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/Matters-*.dmg

      # The same record as a file beside the download, so it can be checked without asking GitHub:
      # gh attestation verify <dmg> --repo milolabs/matters-app --bundle <dmg>.intoto.jsonl
      - name: Keep the record beside the image
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/release/Matters-$VERSION-arm64.dmg.intoto.jsonl"

      # A draft: a person reads it, tries the download, and publishes.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes \
            --title "Matters $VERSION" "${prerelease[@]}" \
            dist/release/Matters-*.dmg dist/release/Matters-*.dmg.intoto.jsonl \
            dist/release/Matters-*.spdx.json dist/release/SHA256SUMS.txt
