# Dovecot 2.4 (Debian 13). Test server: plaintext auth on port 143, maildir, one user.
dovecot_config_version = 2.4.1
dovecot_storage_version = 2.4.1

protocols = imap
listen = *
ssl = no
auth_allow_cleartext = yes
auth_mechanisms = plain login

log_path = /dev/stderr
info_log_path = /dev/stderr

mail_driver = maildir
mail_path = ~/Maildir
mail_home = /srv/mail/%{user}

passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
  default_password_scheme = plain
}

userdb static {
  fields {
    uid = vmail
    gid = vmail
  }
}

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
  }
  mailbox Sent {
    special_use = \Sent
  }
  mailbox Trash {
    special_use = \Trash
  }
  mailbox Junk {
    special_use = \Junk
  }
}
